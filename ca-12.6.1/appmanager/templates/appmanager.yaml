# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

#replicaCount is the number of replicas required for this service
replicaCount: 1
#namespace is the place for the service to run
namespace: <NAMESPACE>
image:
  # Placeholders will replaced in runtime based on .env file
  repository: k3d-<NAME_LOCALREGISTRY>:<PORT_LOCALREGISTRY>/<IMAGE_NAME_APPMANAGER>
  tag: <IMAGE_VERSION_APPMANAGER>
  pullPolicy: IfNotPresent

spring:
  datasource:
    url: "jdbc:postgresql://<POSTGRESQL_HOST>:<POSTGRESQL_PORT>/<POSTGRESQL_DBNAME_APPMANAGER>"
    username: "<POSTGRESQL_USERNAME>"
    password: "<POSTGRESQL_PASSWORD>"
    driverClassName: org.postgresql.Driver

prs:
  service:
    processEngineUrl: http://processengine:8522/process/rest
    mobiusViewUrl: http://mobiusview:80/mobius/rest

persistence:
  enabled: false
  claimName: appmanager-log-pv-claim

additionalVolumeMounts: []
additionalVolumes: []

asg:
  security:
    enabled: true
    basicauth:
      inbound: false
    appServer:
      enabled: true
      type: CUSTOM
      attributes:
        userName: X-Remote-User
        groupNames:
        groupSeparator:
    jwt:
      enabled: true
      serviceTokenSettings:
        internalConfig:
          urlPatterns: /rest/*
          privateKey: <MOBIUSVIEW_SECURITY_JWT_PRIVATEKEY>
          publicKey: <MOBIUSVIEW_SECURITY_JWT_PUBLICKEY>
          expireSeconds: 36000
  authorization:
    enabled: true
