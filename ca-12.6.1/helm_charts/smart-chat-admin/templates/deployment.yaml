apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-chat-admin.fullname" . }}
  labels:
    {{- include "smart-chat-admin.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "smart-chat-admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "smart-chat-admin.labels" . | nindent 8 }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smart-chat-admin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: "LOG_LEVEL"
              value: "{{ .Values.env.LOG_LEVEL }}"
            - name: "OPENSEARCH_HOST"
              value: "{{ .Values.env.OPENSEARCH_HOST }}"
            - name: "OPENSEARCH_PORT"
              value: "{{ .Values.env.OPENSEARCH_PORT }}"
            - name: "OPENSEARCH_AWS_ENABLED"
              value: "{{ .Values.env.OPENSEARCH_AWS_ENABLED }}"
            {{- if eq .Values.env.OPENSEARCH_AWS_ENABLED "true" }}
            - name: "OPENSEARCH_AWS_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: smart-chat-admin-secrets
                  key: "OPENSEARCH_AWS_ACCESS_KEY"
            - name: "OPENSEARCH_AWS_SECRET_KEY"
              valueFrom:
                secretKeyRef:
                  name: smart-chat-admin-secrets
                  key: "OPENSEARCH_AWS_SECRET_KEY"
            - name: "OPENSEARCH_AWS_REGION"
              value: "{{ .Values.env.OPENSEARCH_AWS_REGION }}"
            {{- end }}
            - name: "OPENSEARCH_SERVER_SSL_ENABLED"
              value: "{{ .Values.env.OPENSEARCH_SERVER_SSL_ENABLED }}"
            - name: "OPENSEARCH_CLIENT_SSL_ENABLED"
              value: "{{ .Values.env.OPENSEARCH_CLIENT_SSL_ENABLED }}"
            {{- if eq .Values.env.OPENSEARCH_SERVER_SSL_ENABLED "true" }}
            - name: "OPENSEARCH_SERVER_CA_BUNDLE_PATH"
              value: "{{ printf "%s/%s" .Values.volumeMounts.smart_chat_certs.mountPath .Values.volumeMounts.smart_chat_certs.ca_bundle_cert }}"
            {{- end }}
            {{- if eq .Values.env.OPENSEARCH_CLIENT_SSL_ENABLED "true" }}
            - name: "OPENSEARCH_CLIENT_CERT_PATH"
              value: "{{ printf "%s/%s" .Values.volumeMounts.smart_chat_certs.mountPath .Values.volumeMounts.smart_chat_certs.client_cert }}"
            - name: "OPENSEARCH_CLIENT_KEY_PATH"
              value: "{{ printf "%s/%s" .Values.volumeMounts.smart_chat_certs.mountPath .Values.volumeMounts.smart_chat_certs.client_key }}"
            {{- end }}
            - name: "OPENSEARCH_USERNAME"
              value: "{{ .Values.env.OPENSEARCH_USERNAME }}"
            - name: "OPENSEARCH_PASSWORD"
              value: "{{ .Values.env.OPENSEARCH_PASSWORD }}"
            - name: "OPENSEARCH_INDEX"
              value: "{{ .Values.env.OPENSEARCH_INDEX }}"

            # Admin users (require password change on first login)
            {{- range $i, $user := .Values.adminUsers }}
            - name: "ADMIN{{ add $i 1 }}_USERNAME"
              value: "{{ $user.username }}"
            - name: "ADMIN{{ add $i 1 }}_PASSWORD"
              value: "{{ $user.password }}"
            {{- end }}
            # Regular users (require password change on first login)
            {{- range $i, $user := .Values.regularUsers }}
            - name: "USER{{ add $i 1 }}_USERNAME"
              value: "{{ $user.username }}"
            - name: "USER{{ add $i 1 }}_PASSWORD"
              value: "{{ $user.password }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          livenessProbe: 
            tcpSocket:
              port: http
            failureThreshold: 3
            periodSeconds: 60
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}            
          volumeMounts:          
          - name: {{ .Values.volumes.logdir.name }}
            mountPath: "{{ .Values.volumeMounts.smart_chat_admin_logs.mountPath }}"
          {{- if or (eq .Values.env.OPENSEARCH_SERVER_SSL_ENABLED "true") (eq .Values.env.OPENSEARCH_CLIENT_SSL_ENABLED "true") }}
          - name: {{ .Values.volumes.smart_chat_admin_certs.name }}
            mountPath: {{ .Values.volumeMounts.smart_chat_admin_certs.mountPath }}
          {{- end }} 
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: {{ .Values.volumes.logdir.name }}
        emptyDir: {}
      {{- if or (eq .Values.env.OPENSEARCH_SERVER_SSL_ENABLED "true") (eq .Values.env.OPENSEARCH_CLIENT_SSL_ENABLED "true") }}
      - name: {{ .Values.volumes.smart_chat_admin_certs.name }}
        secret:
          defaultMode: {{ .Values.volumes.smart_chat_admin_certs.secret.defaultMode }}
          secretName: {{ .Values.volumes.smart_chat_admin_certs.secret.secretName }}
      {{- end }}